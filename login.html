<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NewHub • Login</title>
  <link rel="icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <div class="brand">
        <img src="img/logo.png" alt="" class="logo-circle">
        <div class="brand-text">
          <h1>NewHub</h1>
          <span class="subtitle">Gestão de Produtos & Estoque</span>
        </div>
      </div>
      <nav class="main-nav">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="conferencia.html">Conferência</a>
        <a href="login.html" id="authLink">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="page-header" style="margin-bottom: .8rem;">
          <h2>Acesso ao Sistema</h2>
        </div>

        <form id="loginForm" class="login-form">
          <div class="field">
            <label for="loginUser">Usuário</label>
            <input id="loginUser" type="text" required autocomplete="username">
          </div>
          <div class="field">
            <label for="loginPass">Senha</label>
            <input id="loginPass" type="password" required autocomplete="current-password">
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Entrar</button>
          </div>
          <p id="loginError" class="error-msg" style="display:none;">Usuário ou senha inválidos</p>
        </form>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <span>© 2025 NewHub</span>
    </div>
  </footer>
</body>
</html>
